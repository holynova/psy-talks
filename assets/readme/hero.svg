<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">助人对话练习册 Psy Talks — 心理咨询对话微技能练习地图</title>
  <desc id="desc">暖纸底标题：助人对话练习册，副标题开口之前，先踩一脚刹车；右侧是两只对话气泡对照：红色的别做啥与绿色的要说啥。</desc>

  <rect width="1200" height="360" rx="26" fill="#f6f1e6"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#6e6248">心理咨询微技能 · COUNSELING MICRO-SKILLS</text>
    <text x="56" y="128" font-size="58" font-weight="700" fill="#2b2620">助人对话练习册</text>
    <text x="56" y="168" font-size="23" fill="#4a4234">PSY TALKS — 开口之前，先踩一脚刹车</text>
    <text x="56" y="204" font-size="19" fill="#6b6049">18 项微技能，54 个真实案例，每句回应都有对错对照。</text>
    <g id="chips" font-size="18" fill="#3a3226" text-anchor="middle">
      <g><rect x="56" y="238" width="126" height="36" rx="18" fill="#efe7d3" stroke="#d8cbae" stroke-width="1.5"/><text x="119" y="262">6 层递进</text></g>
      <g><rect x="194" y="238" width="150" height="36" rx="18" fill="#efe7d3" stroke="#d8cbae" stroke-width="1.5"/><text x="269" y="262">18 项微技能</text></g>
      <g><rect x="356" y="238" width="150" height="36" rx="18" fill="#efe7d3" stroke="#d8cbae" stroke-width="1.5"/><text x="431" y="262">54 个案例</text></g>
      <g><rect x="518" y="238" width="150" height="36" rx="18" fill="#efe7d3" stroke="#d8cbae" stroke-width="1.5"/><text x="593" y="262">随机自测</text></g>
    </g>
  </g>

  <g id="dialogue-contrast" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <g id="bubble-wrong">
      <rect x="760" y="48" width="384" height="118" rx="16" fill="#fdecea" stroke="#e8b4a8" stroke-width="1.5"/>
      <text x="784" y="84" font-size="18" font-weight="700" fill="#8f3a26">✕ 别做啥 · 过早安慰</text>
      <text x="784" y="118" font-size="20" fill="#5c3226">“别想太多，一切都会过去的。”</text>
      <text x="784" y="148" font-size="18" fill="#74543f">抹杀了对方当下真实的痛感。</text>
    </g>
    <g id="bubble-better">
      <rect x="760" y="190" width="384" height="118" rx="16" fill="#eef5ec" stroke="#b3d0ae" stroke-width="1.5"/>
      <text x="784" y="226" font-size="18" font-weight="700" fill="#2f5a34">✓ 要说啥 · 情感反映</text>
      <text x="784" y="260" font-size="20" fill="#2e4632">“听起来除了委屈，还有深深的无力。”</text>
      <text x="784" y="290" font-size="18" fill="#47604a">命名情绪，留一个校准的切口。</text>
    </g>
  </g>
</svg>
